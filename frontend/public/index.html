<!DOCTYPE html>
<html lang="it">
    <head>
        <meta charset="utf-8" />
        <link rel="icon" href="%PUBLIC_URL%/favicon.ico" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <meta name="theme-color" content="#0f172a" />
        <meta
            name="description"
            content="ISIS Malignani - Sistema di Gestione Inventario Laboratorio Metrologia"
        />
        <link rel="apple-touch-icon" href="%PUBLIC_URL%/logo192.png" />
        <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />
        <title>ISIS Malignani - Laboratorio Metrologia</title>
        <style>
            * {
                margin: 0;
                padding: 0;
                box-sizing: border-box;
            }
            html, body, #root {
                height: 100%;
                width: 100%;
            }
            body {
                font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Oxygen',
                    'Ubuntu', 'Cantarell', 'Fira Sans', 'Droid Sans', 'Helvetica Neue',
                    sans-serif;
                -webkit-font-smoothing: antialiased;
                -moz-osx-font-smoothing: grayscale;
                background-color: #ffffff;
            }
            .loading-container {
                display: flex;
                flex-direction: column;
                justify-content: center;
                align-items: center;
                height: 100vh;
                background-color: #ffffff;
            }
            .loading-spinner {
                width: 40px;
                height: 40px;
                border: 3px solid #e2e8f0;
                border-top-color: #0f172a;
                border-radius: 50%;
                animation: spin 1s linear infinite;
            }
            .loading-text {
                margin-top: 16px;
                color: #64748b;
                font-size: 14px;
            }
            @keyframes spin {
                to {
                    transform: rotate(360deg);
                }
            }
        </style>
        <script>
            window.addEventListener('error', function(e) {
                if (e.target.tagName === 'LINK' || e.target.tagName === 'SCRIPT') {
                    console.warn('Resource failed to load:', e.target.src || e.target.href);
                }
            }, true);
        </script>
    </head>
    <body>
        <noscript>Devi abilitare JavaScript per utilizzare questa applicazione.</noscript>
        <div id="root">
            <div class="loading-container">
                <div class="loading-spinner"></div>
                <p class="loading-text">Caricamento...</p>
            </div>
        </div>
        <script>
            // Remove loading screen once React mounts
            window.addEventListener('DOMContentLoaded', function() {
                setTimeout(function() {
                    var loadingContainer = document.querySelector('.loading-container');
                    if (loadingContainer && document.querySelector('#root').children.length > 1) {
                        loadingContainer.style.display = 'none';
                    }
                }, 100);
            });
        </script>
    </body>
</html>
